services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - db

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_queue
    command: php artisan queue:work --sleep=3 --tries=2 --timeout=60
    volumes:
      - .:/var/www
    depends_on:
      - db
      - app
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: project_butler
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql

  ngrok:
    image: ngrok/ngrok:latest
    container_name: laravel_ngrok
    restart: always
    command:
      - "http"
      - "app:8000"
    environment:
      NGROK_AUTHTOKEN: 2rv5yhkme0rjAMNl5xrbtSSjXF8_52MEaf727cGAt9uEKYVjG
    depends_on:
      - app

volumes:
  db_data: